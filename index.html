<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f1">
<meta property="og:title" content="For you, Majoni ♡">
<meta property="og:description" content="A small surprise, made with care.">
<title>For you, Majoni ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #fff3f1; --bg2: #ffe3e6; --card: #ffffffd9; --line: #f0d3d9;
  --ink: #3a2230; --soft: #7d6070; --rose: #b4506c; --rose-d: #8f3a54;
  --gold: #e7a53a; --btn-ink: #fff; --paper: #fffdf9;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #1d1119; --bg2: #2b1624; --card: #ffffff0f; --line: #ffffff22;
    --ink: #fbe9ee; --soft: #c7a6b4; --rose: #f08aa7; --rose-d: #ffb3c8;
    --gold: #f2bd5c; --btn-ink: #2a1220; --paper: #2a1b26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #1d1119; --bg2: #2b1624; --card: #ffffff0f; --line: #ffffff22;
  --ink: #fbe9ee; --soft: #c7a6b4; --rose: #f08aa7; --rose-d: #ffb3c8;
  --gold: #f2bd5c; --btn-ink: #2a1220; --paper: #2a1b26; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; overflow-x: hidden; color: var(--ink);
  background: var(--bg1) linear-gradient(180deg, var(--bg1), var(--bg2));
  font-family: "Fraunces", Georgia, "Times New Roman", serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
main { position: relative; z-index: 1; width: min(92%, 540px); margin: 0 auto; padding: 8vh 0 48px; text-align: center; }
h1 { font-weight: 400; font-size: clamp(34px, 9vw, 54px); line-height: 1.12; margin: 0 0 14px; letter-spacing: -.01em; }
h2 { font-weight: 400; font-size: clamp(26px, 7vw, 36px); line-height: 1.2; margin: 6px 0 14px; }
.script { font-family: "Caveat", "Segoe Script", cursive; font-weight: 500; color: var(--rose); font-size: 24px; }
.card { margin-top: 22px; padding: 28px 22px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: 0 14px 40px #8d526014; }
.symbol { font-size: 54px; line-height: 1.2; margin-bottom: 4px; }
.text { font-size: 18px; line-height: 1.8; color: var(--ink); min-height: 5.4em; margin: 8px 0 20px; }
.caret::after { content: "|"; color: var(--rose); animation: blink 1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  padding: 12px 26px; border-radius: 999px; border: 1px solid var(--rose); cursor: pointer;
  background: var(--rose); color: var(--btn-ink); font-weight: 400; font-size: 16px; transition: transform .15s, background .15s;
}
.btn:hover { background: var(--rose-d); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--rose); }
.btn:focus-visible, .icon:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.dots { display: flex; gap: 7px; justify-content: center; margin: 0 0 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
.dots i.on { background: var(--rose); transform: scale(1.25); }
.dots i.done { background: var(--rose-d); opacity: .55; }
.hidden { display: none !important; }
.icon {
  position: fixed; right: 0; top: 0; z-index: 10; margin: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0 0;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
  font-size: 18px; cursor: pointer; backdrop-filter: blur(6px);
}
.icon[aria-pressed="true"] { border-color: var(--rose); box-shadow: 0 0 0 3px #b4506c22; }
.view { animation: fade .6s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Envelope: the one memorable moment */
.env { position: relative; width: min(300px, 78vw); height: 200px; margin: 30px auto 24px; cursor: pointer; perspective: 800px; border: 0; background: none; padding: 0; display: block; }
.env .back { position: absolute; inset: 40px 0 0; background: #e9a5b6; border-radius: 6px 6px 12px 12px; }
.env .note { position: absolute; left: 14px; right: 14px; top: 52px; height: 130px; background: var(--paper); border-radius: 6px; box-shadow: 0 2px 8px #0002; transition: transform .8s .25s ease; display: grid; place-items: center; }
.env .note span { font-family: "Caveat", cursive; font-size: 30px; color: var(--rose); }
.env .front { position: absolute; inset: 40px 0 0; border-radius: 6px 6px 12px 12px; background: linear-gradient(135deg, #f4bccb 50%, transparent 50%), linear-gradient(225deg, #f7c9d5 50%, transparent 50%); clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); background-color: #f2b2c3; }
.env .flap { position: absolute; left: 0; right: 0; top: 40px; height: 100px; background: #d9879d; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s ease; z-index: 3; }
.env.open .flap { transform: rotateX(180deg); z-index: 0; }
.env.open .note { transform: translateY(-62px); }
.env .heart-seal { position: absolute; left: 50%; top: 118px; transform: translateX(-50%); z-index: 4; font-size: 26px; transition: opacity .3s; }
.env.open .heart-seal { opacity: 0; }

.letter { text-align: left; padding: 22px 20px; border-radius: 6px; background: var(--paper); border-left: 3px solid var(--rose); line-height: 1.95; font-size: 17px; }
.letter p { margin: 0 0 14px; opacity: 0; transform: translateY(8px); transition: opacity .7s, transform .7s; }
.letter p.show { opacity: 1; transform: none; }
.sign { font-family: "Caveat", cursive; font-size: 28px; color: var(--rose); margin: 14px 0 18px; }

.heart { position: fixed; bottom: -30px; z-index: 2; pointer-events: none; animation: up linear forwards; opacity: 0; }
@keyframes up { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: .75; } 100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.bday { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; outline: none; }
.line1 { font-size: clamp(34px, 10vw, 58px); line-height: 1.15; }
.line2 { font-family: "Caveat", "Segoe Script", cursive; font-weight: 500; font-size: clamp(88px, 29vw, 160px); color: var(--rose); line-height: 1; margin-top: 6px; }
.w { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; opacity: 0; animation: pop .9s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { 0% { opacity: 0; transform: translateY(46px) scale(.5) rotate(-10deg); } 100% { opacity: 1; transform: none; } }
.bday.live .line2 { animation: glow 2.6s ease-in-out infinite alternate; }
@keyframes glow { from { text-shadow: 0 0 0 #e7a53a00; } to { text-shadow: 0 0 26px #e7a53a88; } }
.balloon { position: fixed; bottom: -100px; width: 46px; height: 58px; border-radius: 50% 50% 48% 48%; z-index: 2; pointer-events: none; opacity: .85; animation: rise linear forwards; }
.balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 46px; background: #00000033; }
@keyframes rise { to { transform: translateY(-125vh) translateX(var(--dx)); } }
#title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }
#msg { font-size: 21px; line-height: 1.85; min-height: 6.5em; }
.bday { position: relative; }
.bday::before { content: ""; position: absolute; inset: -8% -22%; background: radial-gradient(closest-side, #e7a53a38, transparent); opacity: 0; transition: opacity 2.5s; pointer-events: none; z-index: -1; }
.bday.live::before { opacity: 1; }
.lantern { position: fixed; bottom: -90px; width: 34px; height: 44px; border-radius: 40% 40% 30% 30%; background: linear-gradient(#ffd27a, #f2994a); box-shadow: 0 0 22px 6px #ffb34766; z-index: 2; pointer-events: none; opacity: 0; animation: lrise linear forwards, lglow 1.8s ease-in-out infinite alternate; }
@keyframes lrise { 0% { opacity: 0; } 12% { opacity: .95; } 85% { opacity: .9; } 100% { opacity: 0; transform: translateY(-122vh) translateX(var(--dx)); } }
@keyframes lglow { from { filter: brightness(1); } to { filter: brightness(1.25); } }
.icon { backdrop-filter: none; -webkit-backdrop-filter: none; }
.count { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
.count div { min-width: 62px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.count b { display: block; font-weight: 400; font-size: 28px; color: var(--rose); font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--soft); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<button class="icon" id="musicBtn" aria-pressed="false" aria-label="Play music">♪</button>

<main>
  <section id="lock" class="view hidden">
    <div class="symbol" aria-hidden="true">🎁</div>
    <h1 id="lockTitle" tabindex="-1">Abhi nahi 😄</h1>
    <div class="card">
      <p class="text" style="min-height:0">Ye surprise 31 October ko khulega.</p>
      <div class="count" id="count"></div>
    </div>
  </section>

  <section id="intro" class="view hidden">
    <div class="script">a little something</div>
    <h1>For you, Majoni ♡</h1>
    <div class="card">
      <div class="symbol" aria-hidden="true">🎁</div>
      <p class="text" style="min-height:0">Just a few words, made with care for you.</p>
      <button class="btn" id="startBtn">Begin ♡</button>
    </div>
  </section>

  <section id="journey" class="view hidden" aria-live="polite">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="card">
      <div class="symbol" id="sym" aria-hidden="true"></div>
      <h2 id="title" tabindex="-1"></h2>
      <p class="text" id="msg"></p>
      <div class="row">
        <button class="btn ghost" id="backBtn">Back</button>
        <button class="btn" id="nextBtn">Next</button>
      </div>
    </div>
  </section>

  <section id="ending" class="view hidden">
    <h1 id="endTitle" tabindex="-1">Happy Birthday, Majoni.</h1>
    <button class="env" id="env" aria-label="Open your letter">
      <span class="back"></span>
      <span class="note"><span>for you Majoni ♡</span></span>
      <span class="front"></span>
      <span class="flap"></span>
      <span class="heart-seal" aria-hidden="true">❤️</span>
    </button>
    <p class="script" id="envHint">Tap to open</p>
  </section>

  <section id="letterSection" class="view hidden">
    <h2 id="letterTitle" tabindex="-1">A little letter</h2>
    <div class="card">
      <div class="letter" id="letterText"></div>
      <div class="sign">With warmest wishes, always ♡</div>
      <div class="row"><button class="btn ghost" id="letterBack">Previous</button><button class="btn" id="finalBtn">One last thing ♡</button></div>
    </div>
  </section>

  <section id="final" class="view hidden">
    <div class="bday" id="bday" tabindex="-1" role="img" aria-label="Happy Birthday Majoni">
      <div class="line1" id="l1" aria-hidden="true"></div>
      <div class="line2" id="l2" aria-hidden="true"></div>
    </div>
  </section>
</main>

<script>
"use strict";
// CUSTOMIZE: change only the words inside the backticks. Blank lines start a new paragraph.
const birthdayLetter = `
Majoni ❤️

Tumar babe mur monor pora kisu kotha koboloi bisaru.

Tumi mur babe bohut special. Tumar logot kotha patile mon tu bhal hoi jai, aru tumar eta soru hahiyeu mur din tu dhuniya kori dibo pare.

Moi najanu bhobishyote ki hobo, kintu etiya iman kotha kob paru je tumar babe mur monor bhitorot eta alag jagah ase.

Tumar sokol xopun puron houk, tumar mukhot hahi thakok, aru jibonor protitu khujot tumi xukh aru bhalpua pua.

Aji tumar special day. Mur monor pora bisaru je tumar ei notun bosor tu bohut dhuniya houk.

Happy Birthday, Majoni! 🎂❤️

Tumi mur babe special asilaa, ajiu asa, aru mur monor eta dhuniya konot hodai thakiba.

Bohut morom loi ❤️
`;

const surprises = [
  { sym: "🌙", title: "Aji Tumar Din ❤️", message: "Aji tumar birthday ne. Sei kotha bhabi mur mukhot nijoreyei hahi ahi jai." },
  { sym: "✨", title: "Tumar Hahi ✨", message: "Tumar hahi tu dekhile mur mon bhal hoi jai. Sachakoi, eta soru hahiyei bohut din bhal kori dibo pare." },
  { sym: "🌸", title: "Tumar Logot Kotha 🌸", message: "Tumar logot kotha patile xomoi kote jai moi bujipau. Sei muhurtobur mur babe bohut dhuniya." },
  { sym: "💌", title: "Jun Kotha Kobo Nuwari 💌", message: "Kisu kotha moi mukhere kobo nuwari. Kintu tumi mur babe kimaan special, xi mur mon tu jane." },
  { sym: "🌙", title: "Tumar Xopun 🌙", message: "Tumi jun xopun dekha, xei bur pur hok. Moi tumar pasot ase, eitu mone rakhiba." },
  { sym: "🦋", title: "Jodi Kunu Din Bhal Nalage 🦋", message: "Jodi kunu din mon bhal nalage, tumi ekeya nohoa. Moi ase." },
  { sym: "🎂", title: "Notun Bosor 🎂", message: "Notun bosor tu tumar babe bhal khobor loi ahok. Xukh, xanti, aru tumar protitu xopunor logot." },
  { sym: "❤️", title: "Janmadinor Olog, Majoni ❤️", message: "Janmadinor olog, Majoni. Tumi jenekoi asa, thik sei dore bhal. Hodai hahi thakiba." }
];

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Light mode: fewer effects on slower phones
let lite = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
const scaled = n => lite ? Math.ceil(n * .4) : n;
function probeFps() {
  let last = 0, sum = 0, c = 0;
  const f = t => { if (last) { sum += t - last; c++; } last = t; if (c < 100) requestAnimationFrame(f); else if (sum / c > 28) lite = true; };
  requestAnimationFrame(f);
}
const views = ["lock", "intro", "journey", "ending", "letterSection", "final"];
let current = 0, typeTimer = 0, fullMsg = "";

function show(id, focusId) {
  views.forEach(v => $(v).classList.add("hidden"));
  const el = $(id);
  el.classList.remove("hidden", "view"); void el.offsetWidth; el.classList.add("view");
  scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  if (focusId) $(focusId).focus({ preventScroll: true });
}

function typeInto(el, text) {
  clearInterval(typeTimer);
  fullMsg = text;
  if (reduce) { el.textContent = text; el.classList.remove("caret"); return; }
  let i = 0; el.textContent = ""; el.classList.add("caret");
  typeTimer = setInterval(() => {
    i++; el.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(typeTimer); el.classList.remove("caret"); }
  }, 32);
}

function renderDots() {
  $("dots").innerHTML = surprises.map((_, i) => `<i class="${i === current ? "on" : i < current ? "done" : ""}"></i>`).join("");
}

let swapping = false;
function paint(i) {
  current = i;
  const s = surprises[i];
  $("sym").textContent = s.sym;
  $("title").textContent = s.title;
  $("backBtn").classList.toggle("hidden", i === 0);
  $("nextBtn").textContent = i === surprises.length - 1 ? "Open the surprise ♡" : "Next";
  renderDots();
}
function slide(i) {
  const live = !$("journey").classList.contains("hidden") && !reduce;
  if (!live) { paint(i); show("journey", "title"); typeInto($("msg"), surprises[i].message); return; }
  if (swapping) return;
  swapping = true;
  const dir = i >= current ? 1 : -1, card = $("journey").querySelector(".card");
  clearInterval(typeTimer);
  card.style.transition = "opacity .18s, transform .18s";
  card.style.opacity = 0; card.style.transform = "translateX(" + (-18 * dir) + "px)";
  setTimeout(() => {
    paint(i); $("msg").textContent = "";
    card.style.transition = "none"; card.style.transform = "translateX(" + (18 * dir) + "px)";
    void card.offsetWidth;
    card.style.transition = "opacity .25s, transform .25s"; card.style.opacity = 1; card.style.transform = "none";
    typeInto($("msg"), surprises[i].message);
    $("title").focus({ preventScroll: true });
    swapping = false;
  }, 190);
}

function next() {
  if (current < surprises.length - 1) { slide(current + 1); hearts(10); }
  else { clearInterval(typeTimer); show("ending", "endTitle"); hearts(26); confetti(); }
}
function back() { if (current > 0) slide(current - 1); }

$("startBtn").onclick = () => { slide(0); hearts(18); probeFps(); };
$("nextBtn").onclick = next;
$("backBtn").onclick = back;
$("msg").onclick = () => { clearInterval(typeTimer); $("msg").textContent = fullMsg; $("msg").classList.remove("caret"); };

// Swipe between slides
let sx = 0, sy = 0;
$("journey").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("journey").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : back();
}, { passive: true });

// Envelope, then letter revealed paragraph by paragraph
$("env").onclick = () => {
  const env = $("env");
  if (env.classList.contains("open")) return;
  env.classList.add("open"); $("envHint").textContent = ""; chime();
  setTimeout(openLetter, reduce ? 0 : 3200);
};
function openLetter() {
  const box = $("letterText");
  box.innerHTML = "";
  const paras = birthdayLetter.trim().split(/\n\s*\n/);
  paras.forEach(t => { const p = document.createElement("p"); p.textContent = t.trim(); box.appendChild(p); });
  show("letterSection", "letterTitle");
  [...box.children].forEach((p, i) => setTimeout(() => p.classList.add("show"), reduce ? 0 : 500 + i * 900));
}
$("finalBtn").onclick = () => { show("final", "bday"); playBday(); };
$("letterBack").onclick = () => {
  $("env").classList.remove("open"); $("envHint").textContent = "Tap to open";
  show("ending", "endTitle");
};
// Final: only "Happy Birthday Majoni", animated. Tap the text to replay.
function split(el, text, base) {
  el.innerHTML = ""; let i = 0;
  text.split(" ").forEach(w => {
    const wd = document.createElement("span"); wd.className = "w";
    [...w].forEach(ch => {
      const s = document.createElement("span"); s.className = "ch"; s.textContent = ch;
      s.style.animationDelay = (reduce ? 0 : base + i * 0.09) + "s"; wd.appendChild(s); i++;
    });
    el.appendChild(wd); el.appendChild(document.createTextNode(" "));
  });
  return i;
}
function balloons(n) {
  n = scaled(n);
  if (reduce) return;
  const c = ["#e98aa5", "#f2b94f", "#c79be0", "#6cc3b0", "#f2788f"];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const b = document.createElement("span");
    b.className = "balloon"; b.setAttribute("aria-hidden", "true");
    b.style.left = 4 + Math.random() * 88 + "vw";
    b.style.background = c[Math.floor(Math.random() * c.length)];
    b.style.setProperty("--dx", (Math.random() - .5) * 90 + "px");
    b.style.animationDuration = 7 + Math.random() * 4 + "s";
    document.body.appendChild(b);
    b.addEventListener("animationend", () => b.remove(), { once: true });
  }, i * 260);
}
function lanterns(n) {
  n = scaled(n);
  if (reduce) return;
  for (let i = 0; i < n; i++) setTimeout(() => {
    const l = document.createElement("span");
    l.className = "lantern"; l.setAttribute("aria-hidden", "true");
    l.style.left = 4 + Math.random() * 88 + "vw";
    l.style.setProperty("--dx", (Math.random() - .5) * 70 + "px");
    const s = .7 + Math.random() * .7; l.style.width = 34 * s + "px"; l.style.height = 44 * s + "px";
    l.style.animationDuration = 11 + Math.random() * 6 + "s, 1.8s";
    document.body.appendChild(l);
    l.addEventListener("animationend", e => { if (e.animationName === "lrise") l.remove(); });
  }, i * 500);
}
function playBday() {
  const box = $("bday");
  box.classList.remove("live");
  const n = split($("l1"), "Happy Birthday", .3);
  split($("l2"), "Majoni", .3 + n * 0.09 + .25);
  hearts(30); balloons(14); confetti(); sparkle();
  setTimeout(() => { box.classList.add("live"); confetti(); hearts(20); lanterns(14); }, reduce ? 0 : 2600);
}
$("bday").onclick = playBday;

// Date lock: opens 31 October 2026, 12:00 AM IST. Add #preview to the link to skip it while testing.
const UNLOCK = new Date("2026-10-31T00:00:00+05:30").getTime();
let lockTimer = 0;
function tickLock() {
  const left = UNLOCK - Date.now();
  if (left <= 0) { clearInterval(lockTimer); show("intro"); hearts(14); return; }
  const s = Math.floor(left / 1000);
  const parts = [[Math.floor(s / 86400), "din"], [Math.floor(s % 86400 / 3600), "ghonta"], [Math.floor(s % 3600 / 60), "minute"], [s % 60, "second"]];
  $("count").innerHTML = parts.map(p => "<div><b>" + String(p[0]).padStart(2, "0") + "</b><span>" + p[1] + "</span></div>").join("");
}
if (UNLOCK - Date.now() > 0 && location.hash !== "#preview") { show("lock"); tickLock(); lockTimer = setInterval(tickLock, 1000); }
else show("intro");

// Floating hearts
function hearts(n) {
  n = scaled(n);
  if (reduce) return;
  const g = ["♡", "♥", "✦"], c = ["#e98aa5", "#f2b94f", "#c79be0"];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const h = document.createElement("span");
    h.className = "heart"; h.setAttribute("aria-hidden", "true");
    h.textContent = g[Math.floor(Math.random() * g.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 14 + Math.random() * 20 + "px";
    h.style.color = c[Math.floor(Math.random() * c.length)];
    h.style.animationDuration = 4 + Math.random() * 3 + "s";
    document.body.appendChild(h);
    h.addEventListener("animationend", () => h.remove(), { once: true });
  }, i * 70);
}

// Confetti (darker colours so it shows on the light background)
const cv = $("confetti"), cx = cv.getContext("2d");
let bits = [], raf = 0;
function confetti() {
  if (reduce) return;
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0);
  const cols = ["#d9577f", "#e7a53a", "#9a6bd1", "#4fb39a", "#f2788f"];
  bits = Array.from({ length: lite ? 45 : 130 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 10, vy: -Math.random() * 9 - 2,
    s: Math.random() * 5 + 3, life: 110 + Math.random() * 40, c: cols[Math.floor(Math.random() * cols.length)]
  }));
  if (!raf) loop();
}
function loop() {
  raf = requestAnimationFrame(loop);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(p => p.life > 0);
  for (const p of bits) {
    p.x += p.vx; p.y += p.vy; p.vy += .14; p.vx *= .99; p.life--;
    cx.globalAlpha = Math.min(1, p.life / 25); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s * 1.5);
  }
  cx.globalAlpha = 1;
  if (!bits.length) { cancelAnimationFrame(raf); raf = 0; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

// Soft music box: synthesized, starts only when she taps the button
const chords = [[262, 330, 392, 523], [220, 262, 330, 440], [175, 220, 262, 349], [196, 247, 294, 392]];
const tune = chords.flatMap(c => [[c[0], 1.5], [c[1], 1], [c[2], 1], [c[3], 2], [c[2], 1], [c[1], 1.5]]);
let ac = null, playing = false, step = 0, musicTimer = 0;
function note(f, t, dur) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur + .5);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .6);
}
function chime() {
  if (!playing || !ac) return;
  const t = ac.currentTime + .05;
  [784, 988, 1175, 1568].forEach((f, i) => note(f, t + i * .12, .25));
}
function sparkle() {
  if (!playing || !ac) return;
  const t = ac.currentTime + .05;
  [1047, 1319, 1568, 2093, 1568, 2093, 2637].forEach((f, i) => note(f, t + i * .14, .2));
}
function tick() {
  if (!playing) return;
  const [f, b] = tune[step], beat = .5;
  note(f, ac.currentTime + .05, b * beat);
  step++; let wait = b * beat * 1000;
  if (step >= tune.length) { step = 0; wait += 2500; }
  musicTimer = setTimeout(tick, wait);
}
$("musicBtn").onclick = () => {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    playing = !playing;
    $("musicBtn").setAttribute("aria-pressed", String(playing));
    $("musicBtn").setAttribute("aria-label", playing ? "Pause music" : "Play music");
    clearTimeout(musicTimer);
    if (playing) tick();
  } catch (e) { $("musicBtn").classList.add("hidden"); }
};
